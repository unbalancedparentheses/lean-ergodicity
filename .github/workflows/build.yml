name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: No sorries
        run: |
          if grep -rnw sorry LeanErgodicity --include='*.lean'; then exit 1; fi
